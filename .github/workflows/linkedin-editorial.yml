name: LinkedIn editorial

# Armed by the CoC publish action. There is no schedule.
# delay_minutes 10 waits inside this run, then posts. delay_minutes 0 posts now.
# A day with no editorial is a skip. A date already posted is a skip.
on:
  workflow_dispatch:
    inputs:
      date:
        description: 'Editorial date YYYY-MM-DD. Blank means today in New York.'
        required: false
        default: ''
      delay_minutes:
        description: '10 waits ten minutes after publish. 0 posts now.'
        required: false
        default: '10'

permissions:
  contents: write

concurrency:
  group: linkedin-editorial
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check the poster
        run: node scripts/linkedin-editorial.js --self-test
      - name: Require the LinkedIn token
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
        run: |
          if [ -z "$LINKEDIN_ACCESS_TOKEN" ]; then
            echo "LINKEDIN_ACCESS_TOKEN is not set on the GitHub repo"
            exit 1
          fi
      - name: Wait until 10 minutes after publish
        env:
          DELAY_MINUTES: ${{ inputs.delay_minutes }}
        run: |
          minutes="${DELAY_MINUTES:-10}"
          case "$minutes" in
            0|10) ;;
            *) echo "delay_minutes must be 0 or 10"; exit 1 ;;
          esac
          if [ "$minutes" = "0" ]; then
            echo "Posting now"
          else
            echo "Waiting 10 minutes after the editorial publish"
            sleep 600
          fi
      - name: Post the day's editorial
        env:
          LINKEDIN_ACCESS_TOKEN: ${{ secrets.LINKEDIN_ACCESS_TOKEN }}
          LINKEDIN_ORG_ID: '144002244'
          EDITORIAL_DATE: ${{ inputs.date }}
        run: |
          set -o pipefail
          node scripts/linkedin-editorial.js | tee /tmp/linkedin-editorial.log
      - name: Save the ledger
        run: |
          git config user.name "Chronicle Bot"
          git config user.email "bot@chronicleofconvergence.com"
          git add data/linkedin-posts.json
          if git diff --cached --quiet; then
            echo "No ledger change"
          else
            date=$(awk '/^LINKEDIN_RESULT=posted /{print $2}' /tmp/linkedin-editorial.log | tail -1)
            git commit -m "LinkedIn: posted editorial ${date}"
            git push
          fi
