name: Restore Archive

on:
  workflow_dispatch:

jobs:
  restore:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Restore and split archive
        run: node scripts/restore-archive.js

      - name: Commit
        run: |
          git config user.name "Chronicle Bot"
          git config user.email "bot@chronicleofconvergence.com"
          git add data/archive.json data/archive_part*.json index.html
          git commit -m "Restore news archive ($(node -e "const d=JSON.parse(require('fs').readFileSync('data/archive.json'));console.log(d.length+' batches, '+d.reduce((a,b)=>a+b.items.length,0)+' articles')"))" || echo nochange
          git push