name: Daily Editorial Publish (8am ET)

# UTC windows for 08:00 America/New_York (EST=13:00 UTC, EDT=12:00 UTC)
on:
  schedule:
    - cron: '5 12 * * *'
    - cron: '5 13 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force publish today even outside 8am ET'
        required: false
        default: 'true'

permissions:
  contents: write
  actions: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Publish today's editorial (~300 words)
        env:
          FORCE_EDITORIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.force || '' }}
        run: |
          set -o pipefail
          if [ "$FORCE_EDITORIAL" = "true" ] || [ "$FORCE_EDITORIAL" = "1" ]; then
            node scripts/editorial-publish.js --force | tee /tmp/editorial-publish.log
          else
            node scripts/editorial-publish.js | tee /tmp/editorial-publish.log
          fi
      - name: Commit
        run: |
          git config user.name "Chronicle Bot"
          git config user.email "bot@chronicleofconvergence.com"
          published=$(awk '/^Published editorial for /{print $4}' /tmp/editorial-publish.log | tail -1)
          case "$published" in
            [0-9][0-9][0-9][0-9]-[0-9][0-9]-[0-9][0-9]) ;;
            *) published="" ;;
          esac
          git add data/editorial.json data/archive.json data/archive_part*.json index.html
          if [ -n "$published" ] && [ -f "e/${published}.html" ]; then
            if git cat-file -e "HEAD:e/${published}.html" 2>/dev/null; then
              echo "Permalink already on main. Leaving e/${published}.html unstaged."
            else
              git add "e/${published}.html"
            fi
          fi
          if git diff --cached --quiet; then
            echo "No publish changes"
          else
            git commit -m "Editorial publish: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            if [ -n "$published" ]; then
              echo "PUBLISHED_DATE=$published" >> "$GITHUB_ENV"
            fi
          fi
      - name: Queue LinkedIn 10 minutes after publish
        if: env.PUBLISHED_DATE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run linkedin-editorial.yml --ref main \
            -f "date=${PUBLISHED_DATE}" \
            -f delay_minutes=10
