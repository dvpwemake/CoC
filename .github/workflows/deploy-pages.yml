name: Deploy Pages

on:
  push:
    branches: [main]
    # The email sender's data (encrypted plans, sender list, templates, counts) is read through the
    # GitHub API, not the site: a push that only touches it does not need a Pages deploy.
    paths-ignore:
      - 'outbox/status/**'
      - 'outbox/plans/**'
      - 'outbox/senders/**'
      - 'outbox/templates/**'
      - 'outbox/suppressed.enc'
  workflow_dispatch:
  workflow_run:
    workflows:
      - Auto-Scan News
      - Restore Archive
      - Daily Editorial Draft (9pm ET)
      - Daily Editorial Publish (8am ET)
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment2.outputs.page_url || steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'push' && github.sha || 'main' }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # The editorial publish pushes several commits within seconds; on 2026-11-24 the deploy of the last one failed with "Found 0 artifact(s)" right after the artifact was uploaded (GitHub-side
      # timing), and the new edition's page /e/<date>.html stayed 404 for hours, so LinkedIn could not show a preview. The deploy is tried once more after a short wait.
      - id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      - name: Wait before the second deploy attempt
        if: steps.deployment.outcome == 'failure'
        run: sleep 25
      - id: deployment2
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
