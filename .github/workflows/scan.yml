name: Auto-Scan News

on:
  schedule:
    # Every 4 hours
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Crawl science + art feeds
        run: node scripts/scan-crawler.js

      - name: Commit and push
        run: |
          git config user.name "Chronicle Bot"
          git config user.email "bot@chronicleofconvergence.com"
          git add index.html data/archive.json data/archive_part*.json
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-scan: $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
            echo "Pushed successfully"
          fi
