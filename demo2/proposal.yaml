vs_demo1:
  - New design desk owns this pass
  - Light only (hard rule)
  - Background motion redesigned for calm premium (not dark, not noisy grain)
  - Cleaner chrome; less legend clutter on visual (FX listed in REVIEW)

north_star: >
  Aurum Light — bright paper-white product UI with a living but quiet light field
  behind content. Motion serves atmosphere; content stays sharp and readable.

background_motion:
  name: Aurora Field (pure CSS)
  layers:
    - base_wash: static warm off-white gradient
    - field_a: large soft gold radial, slow translate + scale
    - field_b: soft cool radial, counter-phase drift
    - field_c: faint gold bloom near masthead, breathe opacity
    - sheen_band: optional slow horizontal luminance sweep (very low opacity)
  constraints:
    - transform + opacity only on moving layers (compositor-friendly)
    - never obscure text contrast
    - prefers-reduced-motion: freeze fields to static positions
    - no dark canvas, no noise texture, no neon

