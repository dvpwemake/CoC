# CoC DEMO1 — r3 LAST PASS (light only)
schema: coc.design.proposal/v1
id: demo1
revision: 3
title: "CoC Facelift DEMO1 r3 — Lumen (light Signal Minimal)"
path: CoC/demo1/
status: proposal_for_admin_review
push: forbidden
created: 2026-07-29
revised: 2026-07-29
team: IT Team · Design / UI·UX desk
note: >
  r1 rejected (ugly paper clutter). r2 rejected (dark forbidden).
  r3: light scheme only + explicit pure CSS animation catalogue.

color: light_only
north_star: >
  Bright, premium, minimal, futuristic. White/off-white surfaces, one gold accent,
  large air, hairline structure. Visible but refined CSS motion — never neon, never dark.

css_animation_catalogue:
  - id: mesh_drift
    what: Soft multi-stop gradient mesh slowly shifts on page background
  - id: ambient_orbs
    what: Two large blurred orbs float (transform only)
  - id: rise_in
    what: Editorial + cards enter with fade + translateY
  - id: stagger
    what: Cards use animation-delay cascade
  - id: hero_ ken_burns
    what: Hero image slow scale on section hover
  - id: sheen
    what: Card media diagonal light sweep on hover
  - id: accent_draw
    what: Gold line draws left-to-right under media / section labels
  - id: lift
    what: Card/share controls translateY on hover
  - id: chip_active
    what: Filter chips fill + subtle scale when selected
  - id: live_pulse
    what: Live indicator soft box-shadow pulse
  - id: nav_blur
    what: Sticky filters backdrop-filter
  - id: reduced_motion
    what: All motion killed when prefers-reduced-motion

engineering:
  - pure CSS only for motion and category filter (:has + radios)
  - no animation libraries
  - transform/opacity primary; gradient position for mesh
  - light color-scheme meta

files:
  - CoC/demo1/index.html
  - CoC/demo1/REVIEW.html
